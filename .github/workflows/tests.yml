name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - name: Review cycle counter
        run: tests/review-cycle-test.sh

      - name: Cycle-gated prompt rendering
        run: tests/render-prompt-test.sh
